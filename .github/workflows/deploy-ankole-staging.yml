name: Deploy Ankole Profiler (staging @ 10.0.1.117)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-ankole-profiler-staging
  cancel-in-progress: false

env:
  BASE: /var/www/ankole-profiler

jobs:
  deploy:
    runs-on: [self-hosted, ankole-profiler-117]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create release dir
        run: |
          echo "RELEASE=$BASE/releases/${GITHUB_SHA}" >> "$GITHUB_ENV"
          mkdir -p "$BASE/releases/${GITHUB_SHA}"

      - name: Sync source into the NEW release (live app untouched)
        run: |
          rsync -a --delete \
            --exclude='.env' --exclude='.git' --exclude='vendor' \
            --exclude='node_modules' \
            "${{ github.workspace }}/" "$RELEASE/"

      - name: Link shared .env and storage
        run: |
          ln -sfn "$BASE/shared/.env"     "$RELEASE/.env"
          rm -rf "$RELEASE/storage"
          ln -sfn "$BASE/shared/storage"  "$RELEASE/storage"
          mkdir -p "$RELEASE/bootstrap/cache"

      - name: Install deps & build (in the release, not live)
        working-directory: ${{ env.RELEASE }}
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          npm ci --no-audit --no-fund
          npm run build

      - name: Permissions
        run: |
          sudo chown -R www-data:www-data "$BASE/shared/storage" "$RELEASE/bootstrap/cache"
          sudo chmod -R 775 "$BASE/shared/storage" "$RELEASE/bootstrap/cache"

      # NOTE: route:cache is intentionally NOT run, same reason as the
      # other Ankole-Profiler deployments — the root route ("/") is a
      # Closure, which route caching mishandles and yields HTTP 405.
      - name: Migrate (backward-compatible) & cache
        run: |
          sudo -u www-data php8.3 "$RELEASE/artisan" migrate --force
          sudo -u www-data php8.3 "$RELEASE/artisan" route:clear
          sudo -u www-data php8.3 "$RELEASE/artisan" config:cache
          sudo -u www-data php8.3 "$RELEASE/artisan" view:cache
          sudo -u www-data php8.3 "$RELEASE/artisan" storage:link || true

      - name: Atomic switch
        run: |
          ln -sfn "$RELEASE" "$BASE/current-tmp"
          mv -Tf "$BASE/current-tmp" "$BASE/current"
          sudo systemctl reload php8.3-fpm
          sudo systemctl restart ankole-profiler-worker

      - name: Health check (rollback on 5xx)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                 http://127.0.0.1/ -H 'Host: ankole-staging.bcc.co.ug')
          echo "HTTP $code"
          if [ "$code" -ge 500 ]; then
            echo "Health check failed - rolling back"
            prev=$(ls -1dt "$BASE"/releases/*/ | sed -n 2p)
            ln -sfn "${prev%/}" "$BASE/current-tmp" && mv -Tf "$BASE/current-tmp" "$BASE/current"
            sudo systemctl reload php8.3-fpm
            exit 1
          fi

      - name: Prune old releases (keep 5)
        run: ls -1dt "$BASE"/releases/*/ | tail -n +6 | xargs -r rm -rf
